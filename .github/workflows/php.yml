name: PHP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Lint PHP files
        run: find public src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run smoke tests
        run: php tests/smoke.php
